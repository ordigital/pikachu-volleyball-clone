[package]
name = "pikachu-volleyball"
version = "1.0.0"
edition = "2021"
description = "HD remake of Pikachu Volleyball for desktop and Android, built with Rust"

[dependencies]
# Okno, grafika 2D, klawiatura, mysz, dotyk. Audio macroquad wyłączone (nie gra mp3).
macroquad = { version = "0.4", default-features = false }
# Pure-Rust WebP decoder for the large opaque textures (the PNG decoder of macroquad cannot read it).
image-webp = { version = "0.2", default-features = false }

# Native audio: rodio (the browser build uses a small Web Audio plugin instead, see ports/browser).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = "0.19"

# Android audio initializes the JNI context before starting rodio.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[package.metadata.android]
package_name = "com.ordigital.pikavolley"
label = "Pikachu Volleyball Clone"
icon = "@drawable/ic_launcher"
res = "android/res"
android_version = 35
target_sdk_version = 35
min_sdk_version = 21
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "landscape"

[package.metadata.android.application_attributes]
"android:enableOnBackInvokedCallback" = "true"

# XInput works on Windows and Wine, whose Windows Gaming Input support is incomplete.
[target.'cfg(target_os = "windows")'.dependencies]
gilrs = { version = "0.10", default-features = false, features = ["xinput"] }

[target.'cfg(all(not(target_os = "android"), not(target_os = "windows"), not(target_arch = "wasm32")))'.dependencies]
gilrs = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = "symbols"

# Keep OpenGL texture bindings correct when a font atlas grows.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
